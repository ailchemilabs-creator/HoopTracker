<!DOCTYPE html>
<html lang="en">
<head>

        /* Number input clean up */

        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    </style>
</head>

        const Dumbbell = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m14.5 17.5 3 3M11 11.5l2 2M6.5 13.5l3 3M8 15l2 2M15 8l2 2M4.5 9.5l3 3"/><path d="m12.5 19.5 2 2"/><path d="m20.5 11.5-2-2"/><path d="m9.5 12.5-3-3a1.41 1.41 0 0 0-2 0l-1 1a1.41 1.41 0 0 0 0 2l1.5 1.5 2 2 1.5 1.5a1.41 1.41 0 0 0 2 0l1-1a1.41 1.41 0 0 0 0-2z"/><path d="m17.5 14.5 3 3a1.41 1.41 0 0 0 2 0l1-1a1.41 1.41 0 0 0 0-2l-1.5-1.5-2-2-1.5-1.5a1.41 1.41 0 0 0-2 0l-1 1a1.41 1.41 0 0 0 0 2z"/></svg>;
        const TrendingUp = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
        const Star = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
        const Youtube = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>;
        const Maximize2 = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>;
        const X = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const Edit2 = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;

        // --- Data ---
        const DEFAULT_CATEGORIES = [
            { name: "Handles", icon: <CircleDashed /> },
            { name: "Shooting", icon: <Target /> },
            { name: "Finishing", icon: <ChevronRight /> },
            { name: "Vertical Jumping", icon: <TrendingUp /> },
            { name: "Strength Training", icon: <Dumbbell /> }
        ];
        
        const DEFAULT_DRILLS = [
            { id: 'h1', category: 'Handles', name: 'Pound Dribbles', recommendedReps: 100, videoUrl: '', history: [] },
            { id: 'h2', category: 'Handles', name: 'Crossovers', recommendedReps: 50, videoUrl: '', history: [] },
            { id: 'h3', category: 'Handles', name: 'Between the Legs', recommendedReps: 50, videoUrl: '', history: [] },
            { id: 'h4', category: 'Handles', name: 'Behind the Back', recommendedReps: 50, videoUrl: '', history: [] },
            { id: 'h11', category: 'Handles', name: 'Ball Slaps', recommendedReps: 10, videoUrl: '', history: [] },
            { id: 'h19', category: 'Handles', name: 'Low Fingertip Dribbles', recommendedReps: 20, videoUrl: '', history: [] },
            { id: 's1', category: 'Shooting', name: 'Form Shooting', recommendedReps: 50, videoUrl: '', history: [] },
            { id: 's2', category: 'Shooting', name: 'Spot Up Threes', recommendedReps: 100, videoUrl: '', history: [] },
            { id: 'f1', category: 'Finishing', name: 'Mikan Drill', recommendedReps: 50, videoUrl: '', history: [] }
        ];

        // --- Helper functions ---
        const getYouTubeId = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        const fireConfetti = () => {
            if (window.confetti) {
                window.confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#ff6b00', '#ff8533', '#ffffff'],
                    disableForReducedMotion: true
                });
            }
        };

        function App() {
            const [categories, setCategories] = useState([]);
            const [drills, setDrills] = useState([]);
            const [activeCategory, setActiveCategory] = useState("Handles");
            const [selectedDrill, setSelectedDrill] = useState(null);
            const [isLoaded, setIsLoaded] = useState(false);
            const [currentView, setCurrentView] = useState('dashboard');

            // Inputs for new items
            const [newTabName, setNewTabName] = useState("");
            const [isAddingTab, setIsAddingTab] = useState(false);

            // Load Data
            useEffect(() => {
                const savedCategories = JSON.parse(localStorage.getItem('hooptracker_categories'));
                const savedDrills = JSON.parse(localStorage.getItem('hooptracker_drills'));
                
                setCategories(savedCategories && savedCategories.length > 0 ? savedCategories : DEFAULT_CATEGORIES.map(c => c.name));
                setDrills(savedDrills && savedDrills.length > 0 ? savedDrills : DEFAULT_DRILLS);
                setIsLoaded(true);
            }, []);

            // Save Data
            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('hooptracker_categories', JSON.stringify(categories));
                    localStorage.setItem('hooptracker_drills', JSON.stringify(drills));
                }
            }, [categories, drills, isLoaded]);

            // Add Custom Category
            const handleAddCategory = (e) => {
                e.preventDefault();
                if (newTabName.trim() && !categories.includes(newTabName.trim())) {
                    setCategories([...categories, newTabName.trim()]);
                    setActiveCategory(newTabName.trim());
                    setNewTabName("");
                    setIsAddingTab(false);
                }
            };

            const updateDrill = (updatedDrill) => {
                setDrills(drills.map(d => d.id === updatedDrill.id ? updatedDrill : d));
                setSelectedDrill(updatedDrill);
            };

            const logSession = (drill, repsDone) => {
                const now = new Date().toISOString();
                const todayStr = now.split('T')[0];
                
                const updatedDrills = drills.map(d => {
                    if (d.id === drill.id) {
                        return {
                            ...d,
                            history: [...(d.history || []), { date: todayStr, timestamp: Date.now(), reps: parseInt(repsDone) }]
                        };
                    }
                    return d;
                });
                
                setDrills(updatedDrills);
                
                if (selectedDrill && selectedDrill.id === drill.id) {
                    setSelectedDrill(updatedDrills.find(d => d.id === drill.id));
                }
                
                fireConfetti();
            };

            // Today's Stats
            const todayStats = useMemo(() => {
                const today = new Date().toISOString().split('T')[0];
                let sessions = 0;
                let totalReps = 0;
                
                drills.forEach(drill => {
                    if(drill.history) {
                        drill.history.forEach(log => {
                            if (log.date === today) {
                                sessions++;
                                totalReps += log.reps;
                            }
                        });
                    }
                });
                
                return { sessions, totalReps };
            }, [drills]);

            const getCategoryIcon = (catName) => {
                const defaultCat = DEFAULT_CATEGORIES.find(c => c.name === catName);
                return defaultCat ? defaultCat.icon : <Star />;
            };

            const activeDrills = drills.filter(d => d.category === activeCategory);

            if (!isLoaded) return <div className="min-h-screen bg-brand-bg flex items-center justify-center text-brand-orange animate-pulse">Loading...</div>;

            return (
                <div className="min-h-screen bg-brand-bg text-slate-100 flex flex-col font-sans pb-20">
                    
                    {/* Header Top Bar */}
                    <header className="px-4 py-4 md:py-6 flex items-center justify-between sticky top-0 bg-brand-bg/95 backdrop-blur z-40 max-w-xl mx-auto w-full">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setCurrentView('dashboard')}>
                            <div className="bg-brand-orange p-1.5 rounded-lg text-white">
                                <Trophy />
                            </div>
                            <h1 className="text-xl font-black italic tracking-wider">
                                HOOP<span className="text-brand-orange">TRACKER</span>
                            </h1>
                        </div>
                        
                        <div className="flex bg-brand-card rounded-xl p-1 border border-slate-800">
                            <button onClick={() => setCurrentView('dashboard')} className={`p-2 rounded-lg transition-colors ${currentView === 'dashboard' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'}`}>
                                <Dashboard />
                            </button>
                            <button onClick={() => setCurrentView('stats')} className={`p-2 rounded-lg transition-colors ${currentView === 'stats' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'}`}>
                                <Activity />
                            </button>
                            <button onClick={() => setCurrentView('calendar')} className={`p-2 rounded-lg transition-colors ${currentView === 'calendar' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'}`}>
                                <Calendar />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 w-full max-w-xl mx-auto px-4 flex flex-col gap-6">
                        
                        {/* Hero Card */}
                        <div className="bg-gradient-to-br from-brand-orangeGradientStart to-brand-orangeGradientEnd rounded-2xl p-5 md:p-6 text-white relative overflow-hidden shadow-lg shadow-brand-orange/20">
                            {/* Watermark rings */}
                            <svg className="absolute top-0 right-0 -mr-10 -mt-10 opacity-15 pointer-events-none" width="200" height="200" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="40" fill="none" stroke="white" strokeWidth="15" />
                                <circle cx="50" cy="50" r="20" fill="none" stroke="white" strokeWidth="15" />
                            </svg>
                            
                            <div className="relative z-10 flex justify-between items-start mb-6">
                                <div>
                                    <h2 className="text-2xl font-black italic tracking-wider mb-1">TODAY'S GRIND</h2>
                                    <p className="text-orange-100 text-sm font-medium">Keep pushing your limits.</p>
                                </div>
                                <div className="text-orange-100 opacity-90"><Flame /></div>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4 relative z-10">
                                <div>
                                    <div className="text-4xl font-black">{todayStats.sessions}</div>
                                    <div className="text-xs font-bold uppercase tracking-wider text-orange-200 mt-1">Drills Done</div>
                                </div>
                                <div>
                                    <div className="text-4xl font-black">{todayStats.totalReps}</div>
                                    <div className="text-xs font-bold uppercase tracking-wider text-orange-200 mt-1">Total Reps</div>
                                </div>
                            </div>
                        </div>

                        {/* Category Horizontal Scroll */}
                        <div className="flex overflow-x-auto gap-2 hide-scrollbar py-1 snap-x">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setActiveCategory(cat)}
                                    className={`flex items-center gap-2 whitespace-nowrap px-4 py-2.5 rounded-full text-sm font-bold transition-all snap-start ${
                                        activeCategory === cat 
                                        ? 'bg-brand-orange text-white' 
                                        : 'bg-brand-card text-slate-300 hover:bg-slate-800 border border-transparent'
                                    }`}
                                >
                                    {getCategoryIcon(cat)}
                                    {cat}
                                </button>
                            ))}
                            
                            {isAddingTab ? (
                                <form onSubmit={handleAddCategory} className="flex items-center bg-brand-card rounded-full px-2 py-1 snap-start">
                                    <input 
                                        autoFocus
                                        type="text" 
                                        value={newTabName}
                                        onChange={e => setNewTabName(e.target.value)}
                                        placeholder="Tab Name..."
                                        className="bg-transparent outline-none text-sm text-white w-24 px-2"
                                    />
                                    <button type="submit" className="text-brand-orange p-1"><Edit2 /></button>
                                </form>
                            ) : (
                                <button onClick={() => setIsAddingTab(true)} className="flex items-center gap-2 whitespace-nowrap px-4 py-2.5 rounded-full text-sm font-bold bg-brand-card/50 text-slate-400 hover:text-white border border-slate-800 border-dashed snap-start">
                                    + Add
                                </button>
                            )}
                        </div>

                        {/* Drills List */}
                        <div className="flex flex-col gap-4">
                            {activeDrills.map(drill => (
                                <DrillCard 
                                    key={drill.id} 
                                    drill={drill} 
                                    onLog={logSession} 
                                    onOpenProfile={() => setSelectedDrill(drill)} 
                                />
                            ))}
                            
                            {/* Add Drill Button within category */}
                            <button 
                                onClick={() => {
                                    const name = prompt("Enter new drill name:");
                                    if(name) {
                                        const newDrill = {
                                            id: 'custom_' + Date.now(),
                                            category: activeCategory,
                                            name,
                                            recommendedReps: 50,
                                            videoUrl: '',
                                            history: []
                                        };
                                        setDrills([...drills, newDrill]);
                                    }
                                }}
                                className="bg-brand-card border border-slate-700/50 border-dashed rounded-xl p-5 text-slate-400 font-bold hover:text-brand-orange hover:border-brand-orange/50 transition-colors flex items-center justify-center gap-2 mt-2"
                            >
                                <span>+ Add Drill to {activeCategory}</span>
                            </button>
                        </div>
                    </main>

                    {/* Drill Modal */}
                    {selectedDrill && (
                        <DrillModal 
                            drill={selectedDrill}
                            onClose={() => setSelectedDrill(null)}
                            onUpdate={updateDrill}
                            onLog={logSession}
                        />
                    )}
                </div>
            );
        }

        // --- Drill Card Component ---
        function DrillCard({ drill, onLog, onOpenProfile }) {
            const [reps, setReps] = useState(drill.recommendedReps);
            const [justLogged, setJustLogged] = useState(false);

            useEffect(() => {
                setReps(drill.recommendedReps);
            }, [drill.recommendedReps]);

            const handleLog = () => {
                if (reps > 0) {
                    onLog(drill, reps);
                    setJustLogged(true);
                    setTimeout(() => setJustLogged(false), 2000);
                }
            };

            return (
                <div className="bg-brand-card rounded-xl p-4 md:p-5 flex flex-col gap-3 group relative border border-transparent hover:border-slate-700 transition-colors">
                    <div className="flex justify-between items-start">
                        <div className="cursor-pointer" onClick={onOpenProfile}>
                            <h3 className="font-bold text-lg text-slate-100 flex items-center gap-2 group-hover:text-brand-orange transition-colors">
                                {drill.name}
                                <span className="opacity-0 group-hover:opacity-100 text-brand-orange transition-opacity"><Maximize2 /></span>
                            </h3>
                            <p className="text-sm text-slate-400 mt-1">Rec: {drill.recommendedReps} reps</p>
                        </div>
                        {drill.videoUrl && <span className="text-red-500/80"><Youtube /></span>}
                    </div>
                    
                    <div className="flex items-center gap-3 mt-1">
                        <input
                            type="number"
                            value={reps}
                            onChange={(e) => setReps(parseInt(e.target.value) || 0)}
                            className="flex-1 bg-brand-input rounded-lg py-3 px-4 text-center font-bold text-slate-100 focus:outline-none focus:ring-1 focus:ring-brand-orange"
                        />
                        <button
                            onClick={handleLog}
                            disabled={justLogged}
                            className={`px-6 py-3 rounded-lg font-bold text-sm min-w-[90px] transition-all ${
                                justLogged 
                                ? 'bg-emerald-500 text-white' 
                                : 'bg-brand-orange hover:bg-brand-orangeDark text-white'
                            }`}
                        >
                            {justLogged ? 'DONE' : 'LOG'}
                        </button>
                    </div>
                </div>
            );
        }

        // --- Drill Profile Modal ---
        function DrillModal({ drill, onClose, onUpdate, onLog }) {
            const [videoUrl, setVideoUrl] = useState(drill.videoUrl || '');
            const [isEditingVideo, setIsEditingVideo] = useState(!drill.videoUrl);
            const [reps, setReps] = useState(drill.recommendedReps);
            const [isEditingReps, setIsEditingReps] = useState(false);
            const [editRepsVal, setEditRepsVal] = useState(drill.recommendedReps);

            const videoId = getYouTubeId(drill.videoUrl);
            const totalReps = drill.history ? drill.history.reduce((sum, h) => sum + h.reps, 0) : 0;
            const sessions = drill.history ? drill.history.length : 0;

            const handleSaveVideo = () => {
                onUpdate({ ...drill, videoUrl });
                setIsEditingVideo(false);
            };

            const handleSaveReps = () => {
                onUpdate({ ...drill, recommendedReps: editRepsVal });
                setIsEditingReps(false);
                setReps(editRepsVal);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    
                    <div className="relative bg-brand-card w-full max-w-md rounded-2xl flex flex-col max-h-[90vh] overflow-hidden border border-slate-700">
                        {/* Header */}
                        <div className="flex justify-between items-center p-5 border-b border-slate-800">
                            <div>
                                <h2 className="text-xl font-bold text-white leading-tight">{drill.name}</h2>
                                <p className="text-brand-orange text-sm font-bold mt-0.5">{drill.category}</p>
                            </div>
                            <button onClick={onClose} className="p-2 bg-brand-bg rounded-full text-slate-400 hover:text-white transition-colors">
                                <X />
                            </button>
                        </div>

                        {/* Content */}
                        <div className="p-5 overflow-y-auto custom-scrollbar flex-col gap-6 flex">
                            
                            {/* Stats Blocks */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-brand-bg rounded-xl p-4 flex flex-col items-center justify-center border border-slate-800">
                                    <span className="text-3xl font-black text-slate-200">{sessions}</span>
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500 mt-1">Sessions</span>
                                </div>
                                <div className="bg-brand-bg rounded-xl p-4 flex flex-col items-center justify-center border border-slate-800">
                                    <span className="text-3xl font-black text-brand-orange">{totalReps}</span>
                                    <span className="text-[10px] font-bold uppercase tracking-wider text-slate-500 mt-1">Total Reps</span>
                                </div>
                            </div>

                            {/* Training Video */}
                            <div className="flex flex-col gap-3">
                                <div className="flex justify-between items-center">
                                    <h3 className="font-bold flex items-center gap-2 text-slate-200">
                                        <span className="text-red-500"><Youtube /></span> Training Video
                                    </h3>
                                    {!isEditingVideo && (
                                        <button onClick={() => setIsEditingVideo(true)} className="text-brand-orange text-xs font-bold flex items-center gap-1">
                                            <Edit2 /> Edit Link
                                        </button>
                                    )}
                                </div>

                                {isEditingVideo ? (
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Paste YouTube URL..." 
                                            value={videoUrl}
                                            onChange={e => setVideoUrl(e.target.value)}
                                            className="flex-1 bg-brand-bg border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-orange text-white"
                                        />
                                        <button onClick={handleSaveVideo} className="bg-brand-orange text-white px-4 py-2 rounded-lg text-sm font-bold">Save</button>
                                    </div>
                                ) : videoId ? (
                                    <div className="relative pt-[56.25%] rounded-xl overflow-hidden border border-slate-800 bg-black">
                                        <iframe
                                            className="absolute inset-0 w-full h-full"
                                            src={`https://www.youtube.com/embed/${videoId}?rel=0`}
                                            title="YouTube video player"
                                            frameBorder="0"
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                            allowFullScreen
                                        ></iframe>
                                    </div>
                                ) : (
                                    <div className="bg-brand-bg/50 border border-slate-800 border-dashed rounded-xl p-6 text-center">
                                        <p className="text-sm text-slate-500 mb-2">No video linked to this drill.</p>
                                        <button onClick={() => setIsEditingVideo(true)} className="text-brand-orange text-sm font-bold">+ Add Video</button>
                                    </div>
                                )}
                            </div>

                            {/* Log Session */}
                            <div className="bg-brand-bg rounded-xl p-5 border border-slate-800 mt-2">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold flex items-center gap-2 text-slate-200">
                                        <span className="text-emerald-500"><Activity /></span> Log Session
                                    </h3>
                                    {isEditingReps ? (
                                        <div className="flex items-center gap-1">
                                            <input 
                                                type="number" 
                                                value={editRepsVal}
                                                onChange={e => setEditRepsVal(parseInt(e.target.value) || 0)}
                                                className="w-16 bg-brand-input border border-slate-600 rounded px-2 py-1 text-sm text-white"
                                            />
                                            <button onClick={handleSaveReps} className="text-brand-orange text-sm font-bold">Save</button>
                                        </div>
                                    ) : (
                                        <button onClick={() => setIsEditingReps(true)} className="text-slate-400 text-xs font-medium hover:text-slate-200 flex items-center gap-1">
                                            Rec: {drill.recommendedReps} reps <Edit2 />
                                        </button>
                                    )}
                                </div>

                                <div className="flex items-center gap-3">
                                    <input
                                        type="number"
                                        value={reps}
                                        onChange={(e) => setReps(parseInt(e.target.value) || 0)}
                                        className="flex-1 bg-brand-input rounded-xl py-3 px-4 text-center text-lg font-black text-slate-100 focus:outline-none focus:ring-1 focus:ring-brand-orange border border-slate-700"
                                    />
                                    <button
                                        onClick={() => {
                                            if (reps > 0) onLog(drill, reps);
                                        }}
                                        className="px-8 py-3 rounded-xl font-bold bg-brand-orange hover:bg-brand-orangeDark text-white transition-colors"
                                    >
                                        LOG
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
